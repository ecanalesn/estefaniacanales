<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Estefanía Canales - Full Stack Developer | Portfolio</title>
    <meta name="description" content="Portfolio de Estefanía Canales, Full Stack Developer especializada en Vue.js, React, PHP/Laravel y Java. Diseño y desarrollo de aplicaciones web rápidas, accesibles y centradas en la UX." />
    <meta name="keywords" content="Full Stack Developer, Web Design, Vue.js, React, PHP, Laravel, Java, JavaScript, HTML, CSS, desarrollo web, portfolio" />
    <meta name="author" content="Estefanía Canales" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portfolio-estefaniacanales.netlify.app" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Estefanía Canales - Full Stack Developer" />
    <meta property="og:description" content="Portfolio profesional de Estefanía Canales, especializada en desarrollo web full stack y diseño de experiencias centradas en la UX." />
    <meta property="og:image" content="https://portfolio-estefaniacanales.netlify.app/images/estefania.png" />
    <meta property="og:url" content="https://portfolio-estefaniacanales.netlify.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Portfolio Estefanía Canales" />
    <meta property="og:locale" content="es_ES" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Estefanía Canales - Full Stack Developer" />
    <meta name="twitter:description" content="Portfolio profesional de Estefanía Canales, especializada en desarrollo web full stack y UX." />
    <meta name="twitter:image" content="https://portfolio-estefaniacanales.netlify.app/images/estefania.png" />
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#df6e04" />
    <meta name="msapplication-TileColor" content="#df6e04" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>

    <!-- Static form so Netlify's build-time bot can detect it -->
    <!-- (the real form is rendered client-side by Vue in App.vue and must be kept in sync with this one) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.js"></script>
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 1000,
        easing: 'ease-in-out',
        once: true,
        offset: 100
      });
    </script>
  </body>
</html>
